<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铜壶</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #e7e2d8; color: #241c16; }
    .page { height: 100%; display: grid; place-items: center; padding: 16px; perspective: 900px; }
    .card {
      width: min(100%, 320px);
      padding: 14px;
      background: #f7f3ea;
      border: 1px solid #241c16;
      transform-style: preserve-3d;
      box-shadow: 0 16px 30px rgba(36, 28, 22, 0.12);
    }
    .art, .tag, h1, p { transform-style: preserve-3d; }
    .art { width: 100%; height: 150px; display: block; background: #d9c7a4; }
    .tag { margin-top: 10px; font-size: 12px; letter-spacing: 0.08em; color: #7a5b32; }
    h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 1.45rem; }
    p { margin: 6px 0 0; color: #56483c; }
    .price { font-family: var(--latin); font-size: 1.4rem; color: #241c16; }
  </style>
</head>
<body>
  <div class="page">
    <article class="card" id="card">
      <svg class="art" id="art" viewBox="0 0 320 150" aria-hidden="true">
        <rect width="320" height="150" fill="#d7c4a2"/>
        <path d="M118 96c0-28 20-48 46-48h28c18 0 28 14 28 30v8c0 22-16 36-40 36h-18c-24 0-44-10-44-26z" fill="#8d6239"/>
        <path d="M214 78h22a16 16 0 0 1 0 32h-18" fill="none" stroke="#5c3d22" stroke-width="4"/>
        <rect x="150" y="52" width="18" height="10" fill="#c9a06a"/>
      </svg>
      <p class="tag" id="tag">手工 · 只做十二把</p>
      <h1 id="name">侧把铜壶</h1>
      <p>云南锤揲。壶嘴偏短，适合盖碗旁边烧水。桌面移动光标时卡片微倾，触屏保持平放。</p>
      <p class="price" id="price">¥1,280</p>
    </article>
  </div>
  <script src="kit.js"></script>
  <script>
    const kit = window.PreviewKit;
    const card = document.getElementById("card");
    const layers = [
      [document.getElementById("art"), 14],
      [document.getElementById("tag"), 8],
      [document.getElementById("name"), 6],
      [document.getElementById("price"), 10]
    ];
    const state = { rx: 0, ry: 0 };
    const target = { rx: 0, ry: 0 };
    let raf = 0;

    function frame() {
      state.rx += (target.rx - state.rx) * (kit.reduced() ? 1 : 0.18);
      state.ry += (target.ry - state.ry) * (kit.reduced() ? 1 : 0.18);
      card.style.transform = "rotateX(" + state.rx.toFixed(2) + "deg) rotateY(" + state.ry.toFixed(2) + "deg)";
      layers.forEach(function (pair) {
        const shift = pair[1];
        pair[0].style.transform = "translate3d(" + (state.ry * shift / 8).toFixed(2) + "px," + (-state.rx * shift / 10).toFixed(2) + "px, " + shift + "px)";
      });
      if (Math.abs(target.rx - state.rx) > 0.05 || Math.abs(target.ry - state.ry) > 0.05) raf = requestAnimationFrame(frame);
      else raf = 0;
    }

    function kick() {
      if (!raf) raf = requestAnimationFrame(frame);
    }

    if (kit.finePointer()) {
      card.addEventListener("pointermove", function (event) {
        if (event.pointerType === "touch") return;
        const rect = card.getBoundingClientRect();
        const px = (event.clientX - rect.left) / rect.width - 0.5;
        const py = (event.clientY - rect.top) / rect.height - 0.5;
        target.ry = Math.max(-8, Math.min(8, px * 16));
        target.rx = Math.max(-8, Math.min(8, -py * 14));
        kick();
      });
      card.addEventListener("pointerleave", function () {
        target.rx = 0;
        target.ry = 0;
        kick();
      });
    }
  </script>
</body>
</html>
