<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灯塔将亮</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #1b1714; color: #f6f1e8; }
    .page { height: 100%; display: flex; flex-direction: column; padding: 12px; }
    h1 { margin: 0; font-family: "Noto Serif SC", serif; font-size: 1.2rem; }
    p { margin: 4px 0 8px; color: #cbbba8; font-size: 12px; }
    canvas { width: 100%; flex: 1; background: #14110f; }
    .bar { display: flex; gap: 8px; }
    button { min-height: 36px; padding: 0 10px; border: 1px solid #e7c48a; background: transparent; color: #f6f1e8; }
  </style>
</head>
<body>
  <div class="page">
    <h1>灯塔将亮</h1>
    <p>示例海报 · 质点弹簧网格。不是抄来的布料求解器。</p>
    <canvas id="c" width="320" height="220"></canvas>
    <div class="bar">
      <button type="button" id="lift">提起</button>
      <button type="button" id="drop">松手下垂</button>
    </div>
  </div>
  <script src="kit.js"></script>
  <script>
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var cols = 9, rows = 7, rest = 22, gap = 18;
    var pts = [];
    var raf = 0;
    function reset() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      pts = [];
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var px = 70 + x * gap;
        var py = 28 + y * gap;
        pts.push({ x: px, y: py, px: px, py: py, pin: y === 0 && (x === 0 || x === cols - 1) });
      }
      draw();
    }
    function ix(x, y) { return y * cols + x; }
    function satisfy() {
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var a = pts[ix(x, y)];
        [[1, 0], [0, 1]].forEach(function (d) {
          var nx = x + d[0], ny = y + d[1];
          if (nx >= cols || ny >= rows) return;
          var b = pts[ix(nx, ny)];
          var dx = b.x - a.x, dy = b.y - a.y;
          var dist = Math.hypot(dx, dy) || 1;
          var diff = (dist - rest) / dist * 0.18;
          if (!a.pin) { a.x += dx * diff; a.y += dy * diff; }
          if (!b.pin) { b.x -= dx * diff; b.y -= dy * diff; }
        });
      }
    }
    function step() {
      pts.forEach(function (p) {
        if (p.pin) return;
        var vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;
        p.px = p.x; p.py = p.y;
        p.x += vx; p.y += vy + 1.1;
      });
      for (var i = 0; i < 3; i++) satisfy();
    }
    function sag() {
      var sum = 0, n = 0;
      pts.forEach(function (p) { if (!p.pin) { sum += p.y; n++; } });
      return sum / n;
    }
    function draw() {
      ctx.clearRect(0, 0, 320, 220);
      ctx.strokeStyle = "#e7c48a";
      ctx.beginPath();
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var p = pts[ix(x, y)];
        if (x + 1 < cols) { var r = pts[ix(x + 1, y)]; ctx.moveTo(p.x, p.y); ctx.lineTo(r.x, r.y); }
        if (y + 1 < rows) { var d = pts[ix(x, y + 1)]; ctx.moveTo(p.x, p.y); ctx.lineTo(d.x, d.y); }
      }
      ctx.stroke();
    }
    function drop() {
      for (var n = 0; n < 36; n++) step();
      draw();
    }
    reset();
    var base = sag();
    document.getElementById("drop").addEventListener("click", drop);
    document.getElementById("lift").addEventListener("click", reset);
    window.__preview = {
      id: "cloth-carousel",
      mechanism: "verlet-cloth-grid",
      expectAfter: "sagged",
      trigger: drop,
      reset: reset,
      readRaw: function () { return sag() > base + 8 ? "sagged" : "taut"; },
      read: function () { return sag() > base + 8 ? "sagged" : "taut"; }
    };
  </script>
</body>
</html>
