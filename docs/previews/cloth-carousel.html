<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灯塔将亮</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #1b1714; color: #f6f1e8; overflow: hidden; }
    .page { height: 100%; display: flex; flex-direction: column; padding: 12px; }
    h1 { margin: 0; font-family: var(--serif); font-size: 1.3rem; }
    .example { margin: 4px 0 8px; color: #cbbba8; font-size: 12px; }
    .stage { flex: 1; display: grid; place-items: center; perspective: 600px; }
    .poster { width: min(70%, 220px); height: 68%; display: flex; flex-direction: column; transform-origin: top center; }
    .strip { flex: 1; }
    .bar { display: flex; justify-content: space-between; gap: 8px; }
    button { min-height: 36px; padding: 0 10px; border: 1px solid #e7c48a; background: transparent; color: #f6f1e8; }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="title">灯塔将亮</h1>
    <p class="example">示例海报 · 简化的布料弯曲，不是布料物理仿真</p>
    <div class="stage"><div class="poster" id="poster"></div></div>
    <div class="bar">
      <button type="button" id="prev">上一张</button>
      <button type="button" id="lift">提起</button>
      <button type="button" id="next">下一张</button>
    </div>
  </div>
  <script src="kit.js"></script>
  <script>
    var posters = [
      ["灯塔将亮", "#1d3348", "#e7c48a"],
      ["回声唱片", "#8a3b2c", "#f4efe6"],
      ["12.04 夜场", "#23483a", "#f6f1e8"]
    ];
    var poster = document.getElementById("poster");
    var strips = [];
    for (var i = 0; i < 8; i++) {
      var strip = document.createElement("div");
      strip.className = "strip";
      poster.append(strip);
      strips.push(strip);
    }
    var index = 0;
    var lifted = false;
    var kit = window.PreviewKit;
    function paint() {
      var item = posters[index];
      document.getElementById("title").textContent = item[0];
      strips.forEach(function (strip, i) {
        strip.style.background = i % 2 ? item[1] : item[2];
        var bend = lifted || kit.reduced() ? 0 : (i - 3.5) * 4;
        strip.style.transform = "rotateX(" + bend + "deg)";
      });
    }
    function go(step) { index = (index + step + posters.length) % posters.length; lifted = false; paint(); }
    document.getElementById("prev").addEventListener("click", function () { go(-1); });
    document.getElementById("next").addEventListener("click", function () { go(1); });
    document.getElementById("lift").addEventListener("click", function () { lifted = !lifted; paint(); });
    poster.addEventListener("click", function () { lifted = !lifted; paint(); });
    paint();
    if (!kit.reduced()) setInterval(function () { if (!lifted) go(1); }, 2600);
  </script>
</body>
</html>
