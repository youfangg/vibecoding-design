<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青釉盏</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #ece6dc; color: #241e18; }
    .page { height: 100%; display: flex; flex-direction: column; }
    .shot {
      position: relative;
      flex: 1.2;
      min-height: 0;
      overflow: hidden;
      background: #d7cfc2;
      cursor: zoom-in;
      touch-action: manipulation;
    }
    .shot.is-zoomed { cursor: zoom-out; }
    .shot svg {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: 50% 50%;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .info { padding: 12px 14px 14px; background: #f7f3ec; }
    .info p { margin: 0; color: #6e6256; font-size: 13px; }
    h1 { margin: 2px 0 4px; font-family: var(--serif); font-size: 1.4rem; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    button { min-height: 36px; padding: 4px 10px; border: 1px solid #241e18; background: transparent; }
  </style>
</head>
<body>
  <div class="page">
    <div class="shot" id="shot" role="img" aria-label="青釉茶盏，可放大看开片">
      <svg id="art" viewBox="0 0 360 280" preserveAspectRatio="xMidYMid slice">
        <rect width="360" height="280" fill="#cfc4b4"/>
        <ellipse cx="180" cy="168" rx="108" ry="28" fill="#b7aa98"/>
        <path d="M78 150c8-62 196-62 204 0-8 18-196 18-204 0z" fill="#8ea897"/>
        <path d="M92 148c10-40 166-40 176 0" fill="#d5e2d4"/>
        <path d="M110 132c18 20 40-8 62 6 16 10 28-16 48-4" fill="none" stroke="#5d6f60" stroke-width="0.7"/>
        <path d="M128 146c12 10 22-6 36 2 10 6 16-8 28-2" fill="none" stroke="#415448" stroke-width="0.6"/>
        <path d="M150 124c6 14 8 22 2 34M196 118c4 16 10 24 4 38M168 112c2 18 6 28 0 42" fill="none" stroke="#f4f7f2" stroke-width="0.5" opacity="0.8"/>
        <circle cx="214" cy="138" r="16" fill="none" stroke="#7d2e24" stroke-width="1.2"/>
        <text x="214" y="142" text-anchor="middle" font-size="11" fill="#7d2e24" font-family="serif">窑</text>
        <text x="24" y="36" font-size="13" fill="#4e453c" font-family="serif">龙泉 · 开片在碗心</text>
      </svg>
    </div>
    <div class="info">
      <div class="row">
        <h1>青釉斗笠盏</h1>
        <button type="button" id="toggle" aria-pressed="false">放大看开片</button>
      </div>
      <p>口径 11.4 cm · 龙泉 · ¥860。桌面悬停跟指针，触屏或按钮可锁定放大。</p>
    </div>
  </div>
  <script src="kit.js"></script>
  <script>
    const kit = window.PreviewKit;
    const shot = document.getElementById("shot");
    const art = document.getElementById("art");
    const toggle = document.getElementById("toggle");
    let locked = false;
    let hovering = false;

    function origin(clientX, clientY) {
      const rect = shot.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 100;
      const y = ((clientY - rect.top) / rect.height) * 100;
      return Math.max(0, Math.min(100, x)) + "% " + Math.max(0, Math.min(100, y)) + "%";
    }

    function paint(on) {
      art.style.transform = on ? "scale(1.85)" : "none";
      shot.classList.toggle("is-zoomed", on);
      toggle.setAttribute("aria-pressed", locked ? "true" : "false");
      toggle.textContent = locked ? "收回" : "放大看开片";
    }

    shot.addEventListener("pointermove", function (event) {
      if (event.pointerType === "touch" || !kit.finePointer()) return;
      art.style.transformOrigin = origin(event.clientX, event.clientY);
      if (!locked) {
        hovering = true;
        paint(true);
      } else {
        paint(true);
      }
    });
    shot.addEventListener("pointerleave", function () {
      hovering = false;
      if (!locked) paint(false);
    });
    shot.addEventListener("click", function (event) {
      locked = !locked;
      if (locked) {
        art.style.transformOrigin = origin(event.clientX, event.clientY);
        paint(true);
      } else {
        paint(false);
      }
    });
    toggle.addEventListener("click", function (event) {
      event.stopPropagation();
      locked = !locked;
      art.style.transformOrigin = "50% 45%";
      paint(locked);
    });
  </script>
</body>
</html>
