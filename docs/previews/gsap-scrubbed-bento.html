<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨蓝便当</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #f4efe8; color: #241c16; overflow: hidden; }
    .scroll { height: 100%; overflow: auto; }
    .runway { height: 280%; }
    .pin { position: sticky; top: 0; height: 100vh; padding: 16px; display: flex; flex-direction: column; }
    h1 { margin: 0; font-family: var(--serif); font-size: 1.35rem; }
    .example { margin: 4px 0 10px; color: #7a6a58; font-size: 12px; }
    .bento { flex: 1; display: grid; grid-template-columns: 1.2fr .8fr; grid-template-rows: 1fr 1fr; gap: 8px; }
    .cell { padding: 12px; background: #fffaf4; border: 1px solid #e6d9c8; opacity: .55; }
    .cell strong { font-family: var(--serif); display: block; }
    .cell.is-on { opacity: 1; background: #241c16; color: #f6f1e8; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="scroll" id="scroll">
    <div class="runway">
      <div class="pin">
        <h1>墨蓝笔记</h1>
        <p class="example">示例功能格，滚动依次聚焦</p>
        <div class="bento" id="bento">
          <article class="cell" data-step="0"><strong>离线先写</strong><p>没网时先记在本机，回来再同步。</p></article>
          <article class="cell" data-step="1"><strong>只读链接</strong><p>分享出去的人不能改你的原文。</p></article>
          <article class="cell wide" data-step="2"><strong>从记要长出任务</strong><p>会议句子可以收成三条待办。</p></article>
        </div>
      </div>
    </div>
  </div>
  <script src="kit.js"></script>
  <script>
    var cells = Array.from(document.querySelectorAll(".cell"));
    var scroll = document.getElementById("scroll");
    var kit = window.PreviewKit;
    function focus(index) {
      cells.forEach(function (cell, i) { cell.classList.toggle("is-on", i === index); });
    }
    function sync() {
      var max = scroll.scrollHeight - scroll.clientHeight;
      var p = max ? scroll.scrollTop / max : 0;
      focus(Math.min(cells.length - 1, Math.floor(p * cells.length)));
    }
    scroll.addEventListener("scroll", sync, { passive: true });
    if (kit.reduced()) cells.forEach(function (cell) { cell.classList.add("is-on"); });
    else {
      focus(0);
      var step = 0;
      setInterval(function () {
        step = (step + 1) % cells.length;
        focus(step);
      }, 1600);
    }
  </script>
</body>
</html>
