<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潮白民宿</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #e7efe8; color: #1d2a24; }
    .page { height: 100%; overflow: auto; padding: 18px 16px 24px; }
    .card { background: #f7fbf7; border: 1px solid #c9d9cf; padding: 14px; }
    .kicker { margin: 0; color: #5d7468; font-size: 12px; letter-spacing: 0.08em; }
    h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 1.5rem; }
    .meta { display: flex; justify-content: space-between; margin-top: 8px; color: #3e564b; }
    .meta strong { font-family: var(--latin); font-size: 1.35rem; font-weight: 500; }
    .ah { overflow: hidden; margin-top: 12px; }
    .copy p { margin: 0 0 8px; }
    .copy p:last-child { margin-bottom: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      min-height: 40px;
      padding: 6px 12px;
      border: 1px solid #1d2a24;
      background: transparent;
    }
    button.primary { background: #1d2a24; color: #f4faf6; }
    .breakfast { display: flex; gap: 8px; align-items: center; padding: 8px; background: #e7f2ea; }
  </style>
</head>
<body>
  <div class="page">
    <article class="card">
      <p class="kicker">潮白 · 双人房</p>
      <h1>周四至周日，临河的那一间</h1>
      <p class="meta"><span>含早餐 · 可加海鲜粥</span><strong>¥860</strong></p>
      <div class="ah" id="box">
        <div class="copy" id="copy"></div>
      </div>
      <div class="actions">
        <button type="button" id="more" aria-expanded="false">展开入住须知</button>
        <button type="button" class="primary" id="add" aria-pressed="false">加一份海鲜粥</button>
      </div>
    </article>
  </div>
  <script src="kit.js"></script>
  <script>
    const kit = window.PreviewKit;
    const box = document.getElementById("box");
    const copy = document.getElementById("copy");
    const more = document.getElementById("more");
    const add = document.getElementById("add");
    let expanded = false;
    let porridge = false;
    let lock = false;

    const shortText = "周四下午三点后入住。房间朝河，有一张可以写字的榆木桌。";
    const longParagraphs = [
      "周四下午三点后入住，周日中午十二点前离开。房间朝河，有一张可以写字的榆木桌。",
      "夜里十点后请走侧门。洗衣在一楼，烘干机要投两枚硬币。",
      "不接待临时加床。若赶海，靴子可以放在门廊，不要带进房间。"
    ];

    function fill() {
      copy.replaceChildren();
      const paragraphs = expanded ? longParagraphs : [shortText];
      paragraphs.forEach(function (text) {
        const p = document.createElement("p");
        p.textContent = text;
        if (!kit.reduced()) {
          p.animate(
            [{ opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)" }],
            { duration: 400, easing: "ease-in-out" }
          );
        }
        copy.append(p);
      });
      if (porridge) {
        const row = document.createElement("div");
        row.className = "breakfast";
        row.textContent = "已加海鲜粥 · 周日早晨 · +¥48";
        copy.append(row);
      }
    }

    function resize() {
      const start = box.getBoundingClientRect().height;
      fill();
      const end = box.scrollHeight;
      if (kit.reduced() || Math.abs(end - start) < 1) {
        box.style.height = "auto";
        return;
      }
      lock = true;
      box.style.height = start + "px";
      requestAnimationFrame(function () {
        box.style.transition = "height 360ms cubic-bezier(0.22, 1, 0.36, 1)";
        box.style.height = end + "px";
      });
      clearTimeout(box._timer);
      box._timer = setTimeout(function () {
        box.style.height = "auto";
        box.style.transition = "";
        lock = false;
      }, 420);
    }

    more.addEventListener("click", function () {
      expanded = !expanded;
      more.setAttribute("aria-expanded", expanded ? "true" : "false");
      more.textContent = expanded ? "收起入住须知" : "展开入住须知";
      resize();
    });
    add.addEventListener("click", function () {
      porridge = !porridge;
      add.setAttribute("aria-pressed", porridge ? "true" : "false");
      add.textContent = porridge ? "去掉海鲜粥" : "加一份海鲜粥";
      resize();
    });
    fill();
  </script>
</body>
</html>
