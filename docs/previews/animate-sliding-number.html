<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>积分柜</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { background: #f6f1e7; color: #241c16; }
    .page { height: 100%; padding: 18px 16px; display: flex; flex-direction: column; }
    .kicker { margin: 0; color: #7a6a5b; font-size: 12px; letter-spacing: 0.08em; }
    h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 1.45rem; }
    .balance { margin-top: 18px; }
    .digits {
      display: inline-flex;
      align-items: flex-end;
      height: 64px;
      overflow: hidden;
      font-family: var(--latin);
      font-variant-numeric: tabular-nums;
      font-size: 56px;
      line-height: 64px;
    }
    .slot { height: 64px; overflow: hidden; }
    .strip { display: flex; flex-direction: column; transition: transform 420ms cubic-bezier(0.22, 1.15, 0.36, 1); }
    .strip span { height: 64px; }
    .sep { height: 64px; }
    .unit { margin: 8px 0 0; color: #6e5e50; }
    .log { margin: 14px 0; color: #3c3128; }
    .actions { display: flex; gap: 8px; margin-top: auto; }
    button { flex: 1; min-height: 44px; border: 1px solid #241c16; background: #fffaf4; }
  </style>
</head>
<body>
  <div class="page">
    <p class="kicker">半亩会员</p>
    <h1>林夏的积分柜</h1>
    <div class="balance">
      <div class="digits" id="digits" aria-hidden="true"></div>
      <p class="sr" id="live" aria-live="polite"></p>
      <p class="unit">分 · 满 2000 可换一饼白茶</p>
    </div>
    <p class="log" id="log">上一次入账是周三的岩茶。</p>
    <div class="actions">
      <button type="button" id="earn">入账 +86</button>
      <button type="button" id="spend">兑换 −200</button>
    </div>
  </div>
  <script src="kit.js"></script>
  <script>
    const kit = window.PreviewKit;
    const digits = document.getElementById("digits");
    const live = document.getElementById("live");
    const log = document.getElementById("log");
    let value = 1280;

    function format(number) {
      return String(number).padStart(4, "0");
    }

    function build() {
      digits.replaceChildren();
      const text = format(value);
      for (let i = 0; i < text.length; i += 1) {
        if (i === 1) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = ",";
          digits.append(sep);
        }
        const slot = document.createElement("span");
        slot.className = "slot";
        const strip = document.createElement("span");
        strip.className = "strip";
        for (let n = 0; n <= 9; n += 1) {
          const cell = document.createElement("span");
          cell.textContent = String(n);
          strip.append(cell);
        }
        strip.style.transform = "translateY(" + (-Number(text[i]) * 64) + "px)";
        slot.append(strip);
        digits.append(slot);
      }
      live.textContent = value.toLocaleString("zh-Hans") + " 分";
    }

    function update(next, message) {
      const previous = format(value);
      value = Math.max(0, next);
      const text = format(value);
      const strips = digits.querySelectorAll(".strip");
      strips.forEach(function (strip, index) {
        if (!kit.reduced() && previous[index] === text[index]) return;
        strip.style.transform = "translateY(" + (-Number(text[index]) * 64) + "px)";
      });
      live.textContent = value.toLocaleString("zh-Hans") + " 分";
      log.textContent = message;
    }

    document.getElementById("earn").addEventListener("click", function () {
      update(value + 86, "入账 86。来自今天的一泡水仙。");
    });
    document.getElementById("spend").addEventListener("click", function () {
      if (value < 200) {
        log.textContent = "还差 " + (200 - value) + " 分，先不兑换。";
        return;
      }
      update(value - 200, "兑换 200。柜员收下一张春茶券。");
    });
    build();
  </script>
</body>
</html>
