<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交互动效资料库</title>
  <meta name="description" content="316 条 AI Coding 交互动效案例。画廊先播放站内复刻，官方文档页单独标明，再复制中文提示词。">
  <meta name="theme-color" content="#f3eee4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="topbar" aria-hidden="true"></div>
  <a class="skip" href="#gallery">跳到案例画廊</a>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" href="./index.html">
        <span class="seal" aria-hidden="true">案</span>
        <span class="brand-text">
          <span class="kicker">AI Coding · 可复制提示词</span>
          <h1 class="brand-title">交互动效资料库</h1>
        </span>
      </a>
      <form class="search" id="search-form" role="search">
        <label for="q">检索</label>
        <input id="q" name="q" type="search" placeholder="标题、技术栈、提示词" autocomplete="off" enterkeyhint="search">
      </form>
      <p class="mast-side">
        <span class="mast-count" id="mast-count">250</span>
        <span class="mast-previewable" id="mast-previewable">可预览</span>
        <span class="mast-date" id="mast-date">2026-11-24</span>
      </p>
    </div>
    <div class="filters">
      <div class="filter-row">
        <h2 id="view-heading">进度</h2>
        <div id="views" class="chip-scroll" role="group" aria-labelledby="view-heading"></div>
      </div>
      <div class="filter-row">
        <h2 id="src-heading">来源</h2>
        <div id="sources" class="chip-scroll" role="group" aria-labelledby="src-heading"></div>
      </div>
      <div class="filter-row">
        <h2 id="cat-heading">主类</h2>
        <div id="cats" class="chip-scroll" role="group" aria-labelledby="cat-heading"></div>
      </div>
      <p class="hint">按 / 聚焦检索，Esc 返回画廊。</p>
    </div>
  </header>
  <noscript>
    <p class="boot">请启用 JavaScript。页面本身是静态的，案例数据已经放在站点文件里，不需要构建。</p>
  </noscript>
  <p id="boot-error" class="boot" hidden>资料没有载入。请打开 docs/index.html，或在仓库里用静态服务器访问 /docs/。</p>
  <main class="shell" id="app" hidden>
    <section class="gallery" id="gallery" tabindex="-1" aria-labelledby="gallery-heading">
      <h2 class="visually-hidden" id="gallery-heading">案例画廊</h2>
      <div class="gallery-bar">
        <p id="count" aria-live="polite" aria-atomic="true">250 条</p>
        <p class="index-lead" id="index-lead">参考组件按案例说明独立实现，不是官方演示的逐像素复刻。</p>
        <button type="button" id="clear" hidden>清除筛选</button>
      </div>
      <p class="filter-note" id="filter-note" hidden></p>
      <div id="list"></div>
      <div id="about"></div>
    </section>
    <article class="reader" id="reader" hidden></article>
  </main>
  <script src="previews/status.js"></script>
  <script src="previews/registry.js"></script>
  <script src="library.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
